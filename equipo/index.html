<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equipo · Comando Central</title>
<meta name="description" content="App del equipo de campo de Ricardo Porras.">
<meta name="theme-color" content="#A90607">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../iconos/favicon-32.png">
<link rel="apple-touch-icon" href="../iconos/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Equipo RP">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  /* Página de entrada: su logo es el ícono al instalarla. Abierta desde el ícono, lleva a la app de Apps Script. */
  :root { --rojo: #A90607; --tinta: #1D1D1F; --gris: #6E6E73; --linea: #ECDCDC; }
  html, body { margin: 0; min-height: 100%; background: var(--rojo); font: 16px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--tinta); }
  main { min-height: 100vh; box-sizing: border-box; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); }
  .tarjeta { width: 100%; max-width: 420px; background: #fff; border-radius: 22px; padding: 26px 22px; box-shadow: 0 16px 40px rgba(0,0,0,.25); text-align: center; }
  .tarjeta img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 6px 18px rgba(169,6,7,.35); }
  h1 { font-size: 22px; margin: 14px 0 4px; }
  .sub { color: var(--gris); margin: 0 0 18px; font-size: 15px; }
  .btn { display: block; width: 100%; box-sizing: border-box; border: 0; border-radius: 14px; padding: 15px; font-weight: 600; font-size: 16px; font-family: inherit; text-decoration: none; cursor: pointer; }
  .btn.rojo { background: var(--rojo); color: #fff; }
  .btn.gris { background: #F2F2F4; color: var(--tinta); margin-top: 10px; }
  .pasos { text-align: left; background: #FBF3F3; border: 1px solid var(--linea); border-radius: 14px; padding: 14px 16px; margin: 0 0 14px; font-size: 15px; }
  .pasos b { display: block; margin-bottom: 6px; }
  .pasos ol { margin: 0; padding-left: 20px; }
  [hidden] { display: none !important; }
  #abriendo { color: #fff; text-align: center; font-weight: 600; }
  #abriendo img { width: 150px; height: 150px; border-radius: 34px; box-shadow: 0 10px 30px rgba(0,0,0,.25); display: block; margin: 0 auto 16px; }
  #abriendo a { color: #fff; }
</style>
</head>
<body>
<main><div class="tarjeta"><p class="sub">Esta página se mudó a <a href="https://ricardo-porras.github.io/equipo/">https://ricardo-porras.github.io/equipo/</a></p></div></main>
<script>location.replace('https://ricardo-porras.github.io/equipo/' + location.search);</script>
</body>
</html>
